name: build

on:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  pull_request:
env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  resourceRunID: ${{ github.run_id }}-${{ github.run_number }}

jobs:
  env-job:
    runs-on: ubuntu-latest
    outputs:
      modified-branch-name: ${{ steps.env.outputs.MODIFIED_BRANCH_NAME }}
    name: Modify branch name
    steps:
      - name: Sets MODIFIED_BRANCH_NAME
        id: env
        env:
          name: "${{env.BRANCH_NAME}}"
        run: |
          echo "MODIFIED_BRANCH_NAME=${name//\//-}" >> ${GITHUB_OUTPUT}
          cat ${GITHUB_OUTPUT}

  container:
    runs-on: ${{ matrix.os }}
    needs:
      - env-job
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: show envs
        run: |
          echo BRANCH_NAME=${{ needs.env-job.outputs.modified-branch-name }}
          echo GITHUB_RUN_ID=${GITHUB_RUN_ID}
      - name: Explain why this job ran
        run: echo ${{ github.event_name }} ${{ github.ref }} event triggered this step.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hannesa2/android-ndk
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: hannesa2/pi_mjpeg_streamer:${{ needs.env-job.outputs.modified-branch-name }}
          platforms: linux/arm/v7,linux/arm64
          load: true
          context: .
#          push: ${{ github.event_name != 'pull_request' }}
#          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

#      - name: Build and push
#        uses: docker/build-push-action@v6
#        with:
#          context: .
#          push: ${{ github.event_name != 'pull_request' }}
#          tags: ${{ steps.meta.outputs.tags }}
#          labels: ${{ steps.meta.outputs.labels }}


      # ${{ steps.meta.outputs.labels }} comes with "***/android-ndk:api30-java11-NDK21
      # so we need it without ***
      - name: Find Tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tagger
        uses: jimschubert/query-tag-action@v2
        with:
          skip-unshallow: 'true'
          commit-ish: HEAD
      - name: Create Github release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{steps.tagger.outputs.tag}}
          generate_release_notes: true
          prerelease: false
          name: ${{steps.tagger.outputs.tag}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
